name: Release

on:
  push:
    tags:
      - v**
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error("Release tag must match package.json version");
            }
          '
      - run: npm ci
      - run: npm run build
      - name: Publish XPI
        run: |
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" .scaffold/build/*.xpi --clobber
      - name: Publish update manifest
        run: |
          if ! gh release view release; then
            gh release create release --target "$RELEASE_TAG" --prerelease --title "Plugin update manifests" --notes 'Hosts update manifests for automatic plugin updates.'
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release upload release .scaffold/build/update-beta.json --clobber
          else
            gh release upload release .scaffold/build/update.json .scaffold/build/update-beta.json --clobber
          fi
